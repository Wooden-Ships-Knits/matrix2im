[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-to-im"
version = "0.1.0"
description = "Baca Excel MATRIX MASTER dan hasilkan JSON untuk sheet IM MASTER"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
matrix2im = "matrix_to_im.cli:main"

[tool.setuptools]
packages = ["matrix_to_im"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regression: dijalankan terhadap file data F27 asli dan golden"]
